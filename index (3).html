<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">

<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#0b4fc4">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="T Schedule">

<style>
:root{--b:#0b4fc4;--bg:#f3f6fc;--cd:#fff;--tx:#10203f;--mu:#6b7a99;--bd:#e2e8f3;--ok:#16a34a;--bad:#ef4444;--or:#f59e0b}
:root[data-t=dark]{--bg:#0d1222;--cd:#171e33;--tx:#eaf0ff;--mu:#93a1c4;--bd:#27304b}
*{box-sizing:border-box;margin:0}html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.hd{background:var(--b);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;font-size:19px;position:sticky;top:0;z-index:5}.hd b{flex:1}.ib{cursor:pointer;font-size:20px}
.p{padding:14px}.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:14px}.mu{color:var(--mu);font-size:12px}
button{background:var(--b);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;width:100%;margin:8px 0;cursor:pointer}button.g{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}button.s{width:auto;padding:6px 12px;margin:0}
input,textarea,select{width:100%;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
label{display:block;font-weight:600;margin-top:10px;font-size:13px}
.tr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);align-items:center;cursor:pointer}.tr:last-child{border:0}.tr>.mu{width:42px;flex:none}.tt{flex:1}.tr i{font-style:normal;font-size:12px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}nav a{flex:1;text-align:center;padding:8px 0;color:var(--mu);font-size:18px;cursor:pointer}nav a small{display:block;font-size:11px}nav a.on{color:var(--b);font-weight:700}
.ch{display:inline-block;padding:6px 14px;border:1px solid var(--bd);border-radius:20px;margin:3px 3px 3px 0;background:var(--cd);cursor:pointer}.ch.on{background:var(--b);color:#fff;border-color:var(--b)}
.sg{display:flex;background:var(--cd);border:1px solid var(--bd);border-radius:20px;overflow:hidden}.sg span{flex:1;text-align:center;padding:8px;cursor:pointer}.sg .on{background:var(--b);color:#fff}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}.cg b{font-size:11px;color:var(--mu)}.cg a{padding:7px 0;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:42px;font-size:13px}.cg a i{width:5px;height:5px;border-radius:50%;margin-top:2px}.cg a.t{background:var(--b);color:#fff}.cg a.s{outline:2px solid var(--b)}
.mo{display:flex;justify-content:space-between}.mo span{text-align:center;font-size:26px;padding:6px;border-radius:12px;cursor:pointer}.mo small{display:block;font-size:10px;color:var(--mu)}.mo .on{background:#cfe0ff;color:#10203f}
.stars span{font-size:30px;color:var(--bd);cursor:pointer}.stars .on{color:#f5b301}
.bs{display:flex;gap:6px;align-items:flex-end;height:120px;justify-content:space-between}.bs div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bs i{display:block;background:var(--b);border-radius:6px 6px 0 0;min-height:3px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.ck{width:26px;height:26px;border:2px solid var(--bd);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}.ck.on{background:var(--ok);border-color:var(--ok)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:84px;width:52px;height:52px;border-radius:50%;background:var(--b);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;z-index:7;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}.mn{background:var(--cd);width:240px;height:100%;padding:calc(20px + env(safe-area-inset-top,0px)) 0}.mn a{display:block;padding:14px 20px;cursor:pointer;font-size:16px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}.sr:last-child{border:0}
.nr{display:flex;gap:6px;align-items:center}.nr input{margin:3px 0}.nr .nt{width:120px;flex:none}.lk{color:var(--b);cursor:pointer;font-weight:600}
.q{color:var(--b);font-size:12px;margin:4px 0 8px}.big{font-size:56px;font-weight:700;text-align:center}
#ring,#lk{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:20;padding:20px}#ring .c,#lk .c{max-width:320px;width:100%;text-align:center}
#sp{position:fixed;inset:0;background:linear-gradient(160deg,#0b4fc4,#06307e);color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}#sp .lg{width:96px;height:96px;background:#fff;color:#0b4fc4;border-radius:24px;font-size:64px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
</style></head><body>
<div id="app"></div>
<div id="ring"><div class="c"><div style="font-size:44px">⏰</div><h2 id="rt"></h2><p class="mu" id="rs"></p><div class="row"><button onclick="act('done',cur.id);stop()">Done</button><button class="g" onclick="act('snooze',cur.id);stop()">Snooze</button><button class="g" onclick="act('later',cur.id);stop()">Later</button></div></div></div>
<div id="lk"><div class="c">🔒<h3>T Schedule</h3><input id="pi" type="password" inputmode="numeric" placeholder="Enter PIN"><button onclick="ul()">Unlock</button></div></div>
<div id="sp"><div class="lg">T</div><h1>T Schedule</h1><p style="margin-top:14px;opacity:.9">Plan Your Day<br>Track Your Progress<br>Build Your Future</p><p class="mu" style="position:absolute;bottom:40px;color:#cfe0ff">Offline · No Login · Your Data</p></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={rem:[],log:{},rev:{},hab:[],rul:[],goal:[],cd:[],note:[],foc:{},set:{theme:'light',vib:1,snd:1,pin:''},fired:{},checklists:[],checkHistory:[]};
try{const o=JSON.parse(localStorage.getItem('tsched')||'{}');S=Object.assign(S,o);S.set=Object.assign({theme:'light',vib:1,snd:1,pin:''},S.set)}catch(e){}
S.checklists=S.checklists||[];S.checkHistory=S.checkHistory||[];S.reviewHistory=S.reviewHistory||[];
const sv=()=>{try{localStorage.setItem('tsched',JSON.stringify(S))}catch(e){}};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8));
const U=()=>Math.random().toString(36).slice(2,8),back=n=>{const d=new Date();d.setDate(d.getDate()-n);return dk(d)};
let T0=dk(new Date());
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const IC=['⭐','🌅','📚','📈','🍽️','🏋️','📝','🙏','💼','🎯'],CL=['#22c55e','#8b5cf6','#ef4444','#f5b301','#a855f7','#f97316','#3b82f6','#14b8a6','#6366f1','#ec4899'];
const QT=['Small steps every day lead to big results.','Discipline beats motivation.','Show up. Do the work. Repeat.','Your future is built today.'];
const RP={daily:'Daily',weekdays:'Weekdays',weekends:'Weekends',once:'Once'};
const fm=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
const ap=(r,k)=>{if(r.rep!=='once'&&k<r.cr)return 0;const d=pd(k).getDay();return r.rep==='daily'||(r.rep==='weekdays'&&d>0&&d<6)||(r.rep==='weekends'&&(d==0||d==6))||(r.rep==='once'&&r.date===k)};
const ls=k=>S.rem.filter(r=>ap(r,k)).sort((a,b)=>a.time.localeCompare(b.time));
const nowT=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};
const st=(r,k)=>(S.log[k]||{})[r.id]?'done':k<T0?'miss':k>T0?'pend':nowT()>=r.time?'prog':'pend';
const SL={done:['Completed','var(--ok)'],prog:['In Progress','var(--b)'],miss:['Missed','var(--bad)'],pend:['Pending','var(--mu)']};
const cn=k=>{const l=ls(k),c={n:l.length,d:0,m:0,r:0};l.forEach(r=>{const s=st(r,k);s=='done'?c.d++:s=='miss'?c.m++:c.r++});c.p=c.n?c.d/c.n:null;return c};
function stk(){let c=0,i=(cn(T0).p||0)>=.7?0:1;for(;i<400;i++){const p=cn(back(i)).p;if(p===null)continue;if(p>=.7)c++;else break}let b=0,r=0;for(let j=400;j>=0;j--){const p=cn(back(j)).p;if(p===null)continue;p>=.7?b=Math.max(b,++r):r=0}return[c,b]}
const ring=(p,z)=>`<svg width="${z}" height="${z}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${p*264} 264" transform="rotate(-90 50 50)"/><text x="50" y="${z<90?56:57}" text-anchor="middle" font-size="${z<90?24:22}" font-weight="700" fill="currentColor">${Math.round(p*100)}%</text></svg>`;
let v='home',pv='home',menu=0,cmode='month',cm=new Date(),sel=T0,pm='d',fl='All',q='',dr=null,rd=T0,fs=1500,fr=0,fiv=null,fmn=25,cur=null,rt=null,ac;const snz=[],MAIN=['home','cal','check','prog','rev'];
function go(x){if(MAIN.includes(v))pv=v;v=x;menu=0;R()}
const bk=()=>{dr=null;v=['check_run','check_edit','check_history'].includes(v)?'check':v==='check_record'?'check_history':v==='review_history'||v==='review_record'?'rev':v.slice(0,2)=='t_'?'trk':pv;R()};
const hd=(t,b,r='')=>`<div class="hd"><span class="ib" onclick="${b?'bk()':'menu=1;R()'}">${b?'←':'☰'}</span><b>${t}</b>${r}</div>`;
const row=(r,k)=>{const[l,c]=SL[st(r,k)];return`<div class="tr" onclick="tg('${r.id}','${k}')"><span class="mu">${r.time}</span><span class="tt">${E(r.title)}</span><i style="color:${c}">${l=='Completed'?'✔ ':''}${l}</i></div>`};
function tg(id,k){const L=S.log[k]=S.log[k]||{};L[id]?delete L[id]:L[id]=1;sv();R()}
const nv=()=>`<nav>${[['home','🏠','Home'],['cal','📅','Calendar'],['check','☑️','Checklist'],['prog','📊','Progress'],['rev','📝','Reviews']].map(([k,i,l])=>`<a class="${v==k?'on':''}" onclick="go('${k}')">${i}<small>${l}</small></a>`).join('')}</nav>`;
const mn=()=>`<div class="ov" onclick="menu=0;R()"><div class="mn" onclick="event.stopPropagation()"><a onclick="go('home')">🏠 Home</a><a onclick="newR()">➕ Add Reminder</a><a onclick="go('sch')">🗂️ Schedules</a><a onclick="go('trk')">🧰 Trackers</a><a onclick="go('check')">☑️ Checklist</a><a onclick="go('set')">⚙️ Settings</a></div></div>`;
function dc(k,l){const c=cn(k);return`<a class="${k==T0?'t':''} ${k==sel?'s':''}" onclick="sel='${k}';cm=pd(sel);R()">${l}<i style="background:${c.p===null?'transparent':c.p>=.7?'var(--ok)':c.p>0?'var(--or)':k<T0?'var(--bad)':'transparent'}"></i></a>`}
function sh(d){const x=pd(sel);x.setDate(x.getDate()+d);sel=dk(x);cm=x;R()}
const sk=x=>{let c=0,i=x.d[T0]?0:1;while(x.d[back(i)]){c++;i++}return c};
const tl=(k,t,e)=>hd(t,1,`<span class="ib" onclick="ad('${k}')">＋</span>`)+`<div class="p"><div class="mu">${e}</div>${S[k].map(x=>`<div class="c"><div class="row"><div style="flex:1"><b>${E(x.n)}</b><div class="mu">🔥 ${sk(x)} day streak</div></div><button class="s" style="background:${x.d[T0]?'var(--ok)':'var(--b)'}" onclick="td('${k}','${x.id}')">${x.d[T0]?'✔ Done':'Mark today'}</button><span onclick="dl('${k}','${x.id}')">✕</span></div><div class="row" style="margin-top:8px;gap:6px">${[6,5,4,3,2,1,0].map(i=>`<span style="width:14px;height:14px;border-radius:50%;background:${x.d[back(i)]?'var(--ok)':'var(--bd)'}"></span>`).join('')}</div></div>`).join('')||'<p class="mu" style="margin-top:12px">Tap ＋ to add one.</p>'}</div>`;
const sl=()=>{const a=S.rem.filter(r=>r.title.toLowerCase().includes(q.toLowerCase())&&(fl=='All'||(fl=='Today'&&ap(r,T0))||(fl=='Upcoming'&&r.rep=='once'&&r.date>T0)||(fl=='Recurring'&&r.rep!='once'))).sort((a,b)=>a.time.localeCompare(b.time));return a.map(r=>{const d=(S.log[T0]||{})[r.id];return`<div class="tr" onclick="edR('${r.id}')"><span class="ic" style="background:${r.cl}">${r.ic}</span><div class="tt"><b>${E(r.title)}</b><div class="mu" style="width:auto">${fm(r.time)} · ${r.rep=='once'?r.date:RP[r.rep]}${r.pri=='high'?' · 🔴 High':''}</div></div><span class="ck ${d?'on':''}" onclick="event.stopPropagation();tg('${r.id}',T0)">${d?'✔':''}</span></div>`}).join('')||'<p class="mu">No schedules yet. Tap ＋ to create one.</p>'};
const L=()=>{$('#lst').innerHTML=sl()};
const VW={
home(){const c=cn(T0),l=ls(T0),d=new Date();return hd('T Schedule',0,`<span class="ib" onclick="go('set')">⚙</span>`)+`<div class="p"><div>${DN[d.getDay()]}, <b>${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}</b></div><div class="q">${QT[d.getDate()%QT.length]}</div><div class="c row">${ring(c.p||0,120)}<div style="line-height:2"><div>✅ <b>${c.d} / ${c.n}</b> <span class="mu">Completed</span></div><div>⭕ <b>${c.r} / ${c.n}</b> <span class="mu">Remaining</span></div><div>❌ <b>${c.m}</b> <span class="mu">Missed</span></div></div></div>${'Notification' in window&&Notification.permission=='default'?`<div class="c row"><span class="mu" style="flex:1">Turn on alarm notifications</span><button class="s" onclick="enN()">Enable</button></div>`:''}<button onclick="newR()">＋ Add Reminder</button><div class="row" style="justify-content:space-between;margin-top:10px"><b>Today's Schedule</b><span class="lk" onclick="go('sch')">View All</span></div><div class="c">${l.map(r=>row(r,T0)).join('')||'<span class="mu">Nothing scheduled today. Tap Add Reminder.</span>'}</div></div>`},
cal(){const y=cm.getFullYear(),m=cm.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),c=cn(sel);let b='';
if(cmode=='month')b=`<div class="c"><div class="row" style="justify-content:space-between"><span class="ib" onclick="cm=new Date(${y},${m-1},1);R()">‹</span><b>${MO[m]} ${y}</b><span class="ib" onclick="cm=new Date(${y},${m+1},1);R()">›</span></div><div class="cg">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<b>${d}</b>`).join('')}${'<span></span>'.repeat(f)}${Array.from({length:n},(_,i)=>dc(dk(new Date(y,m,i+1)),i+1)).join('')}</div></div>`;
else if(cmode=='week'){const w=pd(sel);w.setDate(w.getDate()-((w.getDay()+6)%7));b=`<div class="c"><div class="cg">${[0,1,2,3,4,5,6].map(i=>{const d=new Date(w.getFullYear(),w.getMonth(),w.getDate()+i);return dc(dk(d),DN[d.getDay()]+'<br>'+d.getDate())}).join('')}</div></div>`}
else b=`<div class="c row" style="justify-content:space-between"><span class="ib" onclick="sh(-1)">‹</span><b>${pd(sel).toDateString()}</b><span class="ib" onclick="sh(1)">›</span></div>`;
return hd('Calendar',0)+`<div class="p"><div class="sg">${['day','week','month'].map(x=>`<span class="${cmode==x?'on':''}" onclick="cmode='${x}';R()">${x[0].toUpperCase()+x.slice(1)}</span>`).join('')}</div>${b}<div class="c"><b>Day Progress</b><div class="row">${ring(c.p||0,70)}<div style="line-height:1.8">✅ ${c.d}/${c.n} Completed<br>⭕ ${c.r} Remaining</div></div></div><b>Selected Date (${sel})</b><div class="c">${ls(sel).map(r=>row(r,sel)).join('')||'<span class="mu">No schedules this day</span>'}</div></div>`},
prog(){const n=pm=='d'?1:pm=='w'?7:30;let D=0,N=0,M=0,Rm=0;for(let i=0;i<n;i++){const c=cn(back(i));D+=c.d;N+=c.n;M+=c.m;Rm+=c.r}const[cs,bs]=stk();let bars='';
if(pm=='m'){for(let i=29;i>=0;i--)bars+=`<div><i style="height:${(cn(back(i)).p||0)*90}px"></i></div>`}else{const w=new Date();w.setDate(w.getDate()-((w.getDay()+6)%7));for(let i=0;i<7;i++){const k=dk(new Date(w.getFullYear(),w.getMonth(),w.getDate()+i)),c=cn(k);bars+=`<div>${c.p!==null&&k<=T0?Math.round(c.p*100)+'%':''}<i style="height:${k<=T0?(c.p||0)*90:3}px;${k>T0?'opacity:.25':''}"></i>${DN[(i+1)%7]}</div>`}}
return hd('Progress',0)+`<div class="p"><div class="sg">${[['d','Daily'],['w','Weekly'],['m','Monthly']].map(([k,l])=>`<span class="${pm==k?'on':''}" onclick="pm='${k}';R()">${l}</span>`).join('')}</div><div class="c" style="text-align:center"><div class="mu">${pm=='d'?T0:pm=='w'?'Last 7 days':'Last 30 days'}</div>${ring(N?D/N:0,150)}<div class="row" style="justify-content:space-around"><div><b style="font-size:20px">${D}</b><div class="mu">Completed</div></div><div><b style="font-size:20px">${Rm}</b><div class="mu">Remaining</div></div><div><b style="font-size:20px">${M}</b><div class="mu">Missed</div></div></div></div><div class="c"><b>Progress Overview</b><div class="bs" style="margin-top:10px">${bars}</div></div><div class="c row"><span style="font-size:28px">🔥</span><div style="flex:1"><b>Consistency Streak</b><div style="font-size:20px"><b>${cs} Days</b></div></div><span class="mu">Best Streak: ${bs} Days</span></div></div>`},
rev(){const r=reviewDraft;return hd('Daily Review',0,`<span class="ib" onclick="go('review_history')">◷</span>`)+`<div class="p"><label>Date</label><input type="date" value="${rd}" onchange="rd=this.value||T0;R()"><label>How was your day?</label><div class="mo">${['😣','😕','😐','🙂','😄'].map((e,i)=>`<span class="${r.mood==i+1?'on':''}" onclick="rv('mood',${i+1});R()">${e}<small>${['Very Bad','Bad','Okay','Good','Excellent'][i]}</small></span>`).join('')}</div>${[['well','What went well today?'],['bad',"What didn't go well?"],['imp','What will I improve tomorrow?']].map(([k,l])=>`<label>${l}</label><textarea rows="2" oninput="rv('${k}',this.value)">${E(r[k])}</textarea>`).join('')}<label>Overall rating</label><div class="stars">${[1,2,3,4,5].map(i=>`<span class="${(r.st||0)>=i?'on':''}" onclick="rv('st',${i});R()">★</span>`).join('')}</div><button onclick="reviewSave()">Save Review & New</button><button class="g" onclick="go('review_history')">Review History (${S.reviewHistory.length})</button><div class="mu">Save as many reviews as you want each day. Saving clears this form only.</div></div>`},
